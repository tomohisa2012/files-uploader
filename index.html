<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FileBox - ファイル共有</title>

  <meta
    name="description"
    content="パスワードで保護されたファイル共有サービス"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
  <div class="header-inner">

    <div>
      <h1>📦 FileBox</h1>

      <p>
        パスワードで安全にファイルを共有
      </p>
    </div>

    <button
      id="refreshButton"
      class="secondary-button"
    >
      ↻ 更新
    </button>

  </div>
</header>


<main class="container">

  <section class="info-box">

    <div class="info-icon">ℹ️</div>

    <div>
      <strong>FileBoxについて</strong>

      <p>
        ファイルをアップロードすると、
        パスワード付きで共有できます。
        ダウンロードするにはファイルごとのパスワードが必要です。
      </p>
    </div>

  </section>


  <section class="card upload-card">

    <div class="section-title">
      <h2>📤 ファイルをアップロード</h2>

      <p>
        ファイルを選択して、共有用パスワードを設定してください。
      </p>
    </div>


    <label
      id="dropZone"
      class="drop-zone"
    >

      <input
        id="fileInput"
        type="file"
        hidden
      >

      <div class="drop-icon">
        📁
      </div>

      <strong>
        ファイルをここにドロップ
      </strong>

      <span>
        またはクリックしてファイルを選択
      </span>

    </label>


    <div
      id="selectedFile"
      class="selected-file hidden"
    >

      <div class="selected-file-icon">
        📄
      </div>

      <div class="selected-file-info">
        <strong id="selectedFileName">
          -
        </strong>

        <span id="selectedFileSize">
          -
        </span>
      </div>

      <button
        id="removeSelectedFile"
        class="icon-button"
        type="button"
      >
        ×
      </button>

    </div>


    <div
      id="passwordArea"
      class="password-area hidden"
    >

      <label for="uploadPassword">
        🔐 ダウンロードパスワード
      </label>

      <input
        id="uploadPassword"
        type="password"
        placeholder="パスワードを入力"
        autocomplete="new-password"
      >

      <small>
        ダウンロード時にこのパスワードが必要になります。
      </small>

    </div>


    <button
      id="uploadButton"
      class="primary-button full-button"
      disabled
    >
      📤 アップロード
    </button>


    <div
      id="progressArea"
      class="progress-area hidden"
    >

      <div class="progress-header">

        <span>
          アップロード中...
        </span>

        <span id="progressText">
          0%
        </span>

      </div>

      <div class="progress-track">

        <div
          id="progressBar"
          class="progress-bar"
        ></div>

      </div>

    </div>


    <div
      id="message"
      class="message hidden"
    ></div>

  </section>


  <section class="card">

    <div class="files-header">

      <div>
        <h2>📂 ファイル一覧</h2>

        <p>
          アップロードされたファイル
        </p>
      </div>

      <div class="file-count">
        <span id="fileCount">0</span> 件
      </div>

    </div>


    <div class="search-area">

      <input
        id="searchInput"
        type="search"
        placeholder="🔎 ファイル名を検索..."
      >

    </div>


    <div
      id="loading"
      class="state"
    >
      読み込み中...
    </div>


    <div
      id="empty"
      class="state hidden"
    >
      <div class="empty-icon">
        📭
      </div>

      <strong>
        ファイルがありません
      </strong>

      <span>
        上からファイルをアップロードしてください。
      </span>
    </div>


    <div
      id="fileList"
      class="file-list"
    ></div>

  </section>

</main>


<template id="fileTemplate">

  <article class="file-card">

    <div class="file-main">

      <div class="file-icon">
        📄
      </div>

      <div class="file-info">

        <div class="file-name-row">

          <strong class="file-name">
            -
          </strong>

          <span class="lock-badge">
            🔒 保護
          </span>

        </div>

        <div class="file-meta">

          <span class="file-size">
            -
          </span>

          <span>•</span>

          <span class="file-date">
            -
          </span>

        </div>

      </div>

    </div>


    <div class="file-access">

      <div class="file-password-row">

        <input
          class="file-password"
          type="password"
          placeholder="パスワード"
          autocomplete="off"
        >

        <button
          class="auth-button"
          type="button"
        >
          認証
        </button>

      </div>


      <div class="auth-message"></div>


      <div class="file-actions hidden">

        <button
          class="download-button"
          type="button"
        >
          📥 ダウンロード
        </button>

        <button
          class="copy-button"
          type="button"
        >
          🔗 URLコピー
        </button>

        <button
          class="delete-button"
          type="button"
        >
          🗑️ 削除
        </button>

      </div>

    </div>

  </article>

</template>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="script.js"></script>

</body>
</html>
